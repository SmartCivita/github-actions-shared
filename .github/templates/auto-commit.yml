name: Auto Commit Message

on:
  push:
    branches:
      - "*"

# Collapse duplicate runs when multiple pushes land in quick succession on the
# same branch. The bot's own amend push is already blocked at the source by the
# [skip ci] trailer appended in apply-commit-fix.sh, so this is just a safety
# net for rapid human pushes.
concurrency:
  group: auto-commit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  call-auto-commit:
    uses: SmartCivita/github-actions-shared/.github/workflows/auto-commit-message.yml@main
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
