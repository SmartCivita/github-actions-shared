name: Auto Commit Message

on:
  push:
    branches:
      - "*"
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: main
        description: Target branch for PR
      runner-label:
        type: string
        default: self-hosted
        description: Runner label to use
    secrets:
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-commit-message:
    runs-on: ${{ inputs.runner-label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Get commit info
        id: commit-info
        run: |
          BRANCH="${{ github.ref_name }}"
          CURRENT_MSG=$(git log -1 --pretty=format:"%s" | tr '\n' ' ' | sed 's/ $//')
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          FILE_COUNT=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l)

          echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT
          echo "CURRENT_MSG=$CURRENT_MSG" >> $GITHUB_OUTPUT
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_OUTPUT

      - name: Fix commit message
        id: fix
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          echo "AUTO-COMMIT: Analyzing commit message"
          CURRENT_MSG='${{ steps.commit-info.outputs.CURRENT_MSG }}'
          echo "Current: $CURRENT_MSG"

          if echo "$CURRENT_MSG" | grep -q ':'; then
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES='${{ steps.commit-info.outputs.CHANGED_FILES }}'
          FILE_COUNT='${{ steps.commit-info.outputs.FILE_COUNT }}'

          PROMPT="Improve this commit message. Current: $CURRENT_MSG. Files ($FILE_COUNT): $CHANGED_FILES. Output ONLY the new message in format: type(scope) description. Be specific."

          RESPONSE=$(curl -s --connect-timeout 30 --max-time 60 \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"qwen3.7-max\",\"messages\":[{\"role\":\"user\",\"content\":\"$PROMPT\"}],\"max_tokens\":100,\"temperature\":0.3}")

          NEW_MSG=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null | head -1 | sed 's/^[*># ]*//' | cut -c1-72)

          if [ -z "$NEW_MSG" ] || [ "$NEW_MSG" = "null" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "New: $NEW_MSG"
          echo "status=success" >> $GITHUB_OUTPUT
          echo "NEW_MSG=$NEW_MSG" >> $GITHUB_OUTPUT

      - name: Apply fix
        if: steps.fix.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          git commit --amend -m "${{ steps.fix.outputs.NEW_MSG }}" --no-verify
          git push --force-with-lease origin ${{ github.ref_name }}

      - name: Discord notification
        if: steps.fix.outputs.status == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD="{\"username\":\"AutoCommit\",\"embeds\":[{\"title\":\"Commit Fixed\",\"color\":5763719,\"fields\":[{\"name\":\"Before\",\"value\":\"${{ steps.commit-info.outputs.CURRENT_MSG }}\"},{\"name\":\"After\",\"value\":\"${{ steps.fix.outputs.NEW_MSG }}\"}],\"timestamp\":\"$TIMESTAMP\"}]}"
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
