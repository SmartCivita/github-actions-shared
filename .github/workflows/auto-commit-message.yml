name: Auto Commit Message

on:
  push:
    branches:
      - "*"
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

# Collapse duplicate runs on the same branch. The bot's own amend push is
# blocked at the source by the [skip ci] trailer appended in apply-commit-fix.sh.
concurrency:
  group: auto-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-commit-message:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: SmartCivita/github-actions-shared/.github/actions/auto-commit@main
        with:
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
          personal-access-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
