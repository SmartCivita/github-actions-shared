name: Auto Commit Message

on:
  push:
    branches:
      - "*"
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true

permissions:
  contents: write

jobs:
  update-commit-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Fix commit message
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TARGET_BRANCH: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        id: fix
        run: |
          echo "::add-mask::$OPENCODE_API_KEY"

          BRANCH="$TARGET_BRANCH"
          echo "Processing commit on branch: $BRANCH"

          CURRENT_MSG=$(git log -1 --pretty=format:"%s")

          if echo "$CURRENT_MSG" | grep -q ':' || echo "$CURRENT_MSG" | grep -q -i '^Merge'; then
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "Skipping: message already follows conventional commits or is a merge"
            exit 0
          fi

          DIFF=$(git diff HEAD~1 HEAD 2>/dev/null | head -c 2000)

          [ -z "$DIFF" ] && echo "status=skipped" >> $GITHUB_OUTPUT && exit 0

          PROMPT="Respond in English only. Conventional commit message for this diff. Format: type(scope): description. Diff: $DIFF"

          COMMIT_MSG=""

          for MODEL in mimo-v2.5-free nemotron-3-super-free; do
            RESPONSE=$(curl -sf --connect-timeout 10 --max-time 30 -X POST "https://opencode.ai/zen/v1/chat/completions" \
              -H "Authorization: Bearer $OPENCODE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg prompt "$PROMPT" --arg model "$MODEL" \
                '{model:$model, messages:[{role:"user",content:$prompt}], max_tokens:512, temperature:0.3}')") || continue

            COMMIT_MSG=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null | head -1 | cut -c1-72) || continue

            [ -n "$COMMIT_MSG" ] && [ "$COMMIT_MSG" != "null" ] && break
          done

          if [ -n "$COMMIT_MSG" ] && [ "$COMMIT_MSG" != "null" ] && [ "$COMMIT_MSG" != "" ]; then
            set +e
            OLD_MSG="$CURRENT_MSG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --amend -m "$COMMIT_MSG" --no-verify
            git push --force-with-lease origin $BRANCH
            set -e

            echo "status=success" >> $GITHUB_OUTPUT
            echo "old_msg=$OLD_MSG" >> $GITHUB_OUTPUT
            echo "new_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Discord notification
        if: ${{ steps.fix.outputs.status == 'success' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          OLD_MSG: ${{ steps.fix.outputs.old_msg }}
          NEW_MSG: ${{ steps.fix.outputs.new_msg }}
          SHA: ${{ github.sha }}
        run: |
          COMMIT_LINK="[${SHA:0:7}]($REPO_URL/commit/$SHA)"
          BRANCH_LINK="[${{ github.ref_name }}]($REPO_URL/tree/${{ github.ref_name }})"
          AUTHOR_LINK="[$ACTOR](https://github.com/$ACTOR)"
          REPO_LINK="[$REPO_NAME]($REPO_URL)"

          OLD_MSG_ESC=$(printf '%s' "$OLD_MSG" | sed 's/\\/\\\\/g; s/"/\\"/g' | cut -c1-200)
          NEW_MSG_ESC=$(printf '%s' "$NEW_MSG" | sed 's/\\/\\\\/g; s/"/\\"/g' | cut -c1-200)
          COMMIT_LINK_ESC=$(printf '%s' "$COMMIT_LINK" | sed 's/\\/\\\\/g; s/"/\\"/g')
          BRANCH_LINK_ESC=$(printf '%s' "$BRANCH_LINK" | sed 's/\\/\\\\/g; s/"/\\"/g')
          AUTHOR_LINK_ESC=$(printf '%s' "$AUTHOR_LINK" | sed 's/\\/\\\\/g; s/"/\\"/g')
          REPO_LINK_ESC=$(printf '%s' "$REPO_LINK" | sed 's/\\/\\\\/g; s/"/\\"/g')

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          PAYLOAD="{\"username\":\"AutoCommit Bot\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/9919?v=4\",\"embeds\":[{\"title\":\"📝 Commit Message Fixed\",\"url\":\"$RUN_URL\",\"color\":5763719,\"fields\":[{\"name\":\"Repository\",\"value\":\"$REPO_LINK_ESC\",\"inline\":true},{\"name\":\"Branch\",\"value\":\"$BRANCH_LINK_ESC\",\"inline\":true},{\"name\":\"Commit\",\"value\":\"$COMMIT_LINK_ESC\",\"inline\":true},{\"name\":\"Author\",\"value\":\"$AUTHOR_LINK_ESC\",\"inline\":true},{\"name\":\"Before\",\"value\":\"$OLD_MSG_ESC\",\"inline\":false},{\"name\":\"After\",\"value\":\"$NEW_MSG_ESC\",\"inline\":false}],\"footer\":{\"text\":\"GitHub Actions\",\"icon_url\":\"https://avatars.githubusercontent.com/u/9919?v=4\"},\"timestamp\":\"$TIMESTAMP\"}]}"

          curl -sf -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" && echo " [Discord] Notification sent" || echo " [Discord] Notification failed"