name: Auto Commit Message

on:
  push:
    branches:
      - "*"
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true

permissions:
  contents: write

jobs:
  update-commit-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Fix commit message
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TARGET_BRANCH: ${{ github.ref_name }}
        id: fix
        run: |
          echo "::add-mask::$OPENCODE_API_KEY"
          
          CURRENT_MSG=$(git log -1 --pretty=format:"%s")
          
          if echo "$CURRENT_MSG" | grep -q ':' || echo "$CURRENT_MSG" | grep -q -i '^Merge'; then
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "Skipping: message already follows conventional commits or is a merge"
            exit 0
          fi
          
          DIFF=$(git diff HEAD~1 HEAD 2>/dev/null | head -c 2000)
          
          [ -z "$DIFF" ] && echo "status=skipped" >> $GITHUB_OUTPUT && exit 0
          
          PROMPT="Respond in English only. Conventional commit message for this diff. Format: type(scope): description. Diff: $DIFF"
          
          COMMIT_MSG=""
          
          for MODEL in mimo-v2.5-free nemotron-3-super-free; do
            RESPONSE=$(curl -sf --connect-timeout 10 --max-time 30 -X POST "https://opencode.ai/zen/v1/chat/completions" \
              -H "Authorization: Bearer $OPENCODE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg prompt "$PROMPT" --arg model "$MODEL" \
                '{model:$model, messages:[{role:"user",content:$prompt}], max_tokens:512, temperature:0.3}')") || continue
            
            COMMIT_MSG=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null | head -1 | cut -c1-72) || continue
            
            [ -n "$COMMIT_MSG" ] && [ "$COMMIT_MSG" != "null" ] && break
          done
          
          if [ -n "$COMMIT_MSG" ] && [ "$COMMIT_MSG" != "null" ] && [ "$COMMIT_MSG" != "" ]; then
            set +e
            OLD_MSG="$CURRENT_MSG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --amend -m "$COMMIT_MSG" --no-verify
            git push --force-with-lease origin $TARGET_BRANCH
            set -e
            
            echo "status=success" >> $GITHUB_OUTPUT
            echo "old_msg=$OLD_MSG" >> $GITHUB_OUTPUT
            echo "new_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Discord notification
        if: ${{ steps.fix.outputs.status == 'success' }}
        uses: SmartCivita/github-actions-shared/.github/actions/discord-notify@main
        with:
          title: "Commit Processed"
          color: "5763719"
          description: ""
          url: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          event-type: commit
          old-msg: "${{ steps.fix.outputs.old_msg }}"
          new-msg: "${{ steps.fix.outputs.new_msg }}"
          commit-sha: "${{ github.sha }}"
          status: success
          run-url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          webhook: ${{ secrets.DISCORD_WEBHOOK }}