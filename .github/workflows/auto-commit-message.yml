name: Auto Commit Message

on:
  push:
    branches:
      - "*"
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  update-commit-message:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get commit info
        id: info
        run: |
          set -euo pipefail

          # Skip merge commits: rewriting them is destructive and not worth the risk.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
            echo "is_merge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || true)
          FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | grep -c . || true)
          DIFF_CONTENT=$(git diff HEAD~1 HEAD | grep -E '^\+[^+]' | head -20 || true)
          CURRENT_MSG=$(git log -1 --pretty=%s)

          JSON_PATH="$RUNNER_TEMP/commit-info.json"
          jq -n \
            --arg msg "$CURRENT_MSG" \
            --arg files "$CHANGED_FILES" \
            --arg count "$FILE_COUNT" \
            --arg diff "$DIFF_CONTENT" \
            --arg branch "$GITHUB_REF_NAME" \
            '{current_msg:$msg, files:$files, count:($count|tonumber), diff:$diff, branch:$branch}' \
            > "$JSON_PATH"

          {
            echo "is_merge=false"
            echo "current_msg<<EOF"
            echo "$CURRENT_MSG"
            echo "EOF"
            echo "json_path=$JSON_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Fix commit message
        id: fix
        if: steps.info.outputs.is_merge != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          COMMIT_JSON: ${{ steps.info.outputs.json_path }}
        run: |
          set -euo pipefail

          CURRENT_MSG=$(jq -r .current_msg "$COMMIT_JSON")

          # Already a conventional commit, nothing to do.
          if echo "$CURRENT_MSG" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)[:\(]'; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_COUNT=$(jq -r .count "$COMMIT_JSON")
          CHANGED_FILES=$(jq -r .files "$COMMIT_JSON")
          DIFF_CONTENT=$(jq -r .diff "$COMMIT_JSON")

          PROMPT="Create a SHORT conventional commit message. Output ONLY the message, nothing else.

          CURRENT MESSAGE: $CURRENT_MSG
          CHANGED FILES ($FILE_COUNT):
          $CHANGED_FILES

          CODE DIFF (added lines only):
          $DIFF_CONTENT

          RULES:
          - Format: type(scope) description
          - Max 72 characters
          - Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert
          - Description must reflect the actual code changes
          - NEVER use backticks, code fences, or markdown
          - Output ONLY the commit message on a single line"

          RESPONSE=$(timeout 60 opencode run --model opencode-go/qwen3.7-max "$PROMPT" 2>/dev/null || true)
          NEW_MSG=$(echo "$RESPONSE" | tr -d '`' | sed 's/^[*#>\ ]*//' | head -1 | cut -c1-72 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -z "$NEW_MSG" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "status=success"
            echo "new_msg<<EOF"
            echo "$NEW_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply fix
        if: steps.fix.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NEW_MSG: ${{ steps.fix.outputs.new_msg }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit --amend -m "$NEW_MSG" --no-verify
          git push --force-with-lease origin "$GITHUB_REF_NAME"

      - name: Discord notification
        if: steps.fix.outputs.status == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OLD_MSG: ${{ steps.info.outputs.current_msg }}
          NEW_MSG: ${{ steps.fix.outputs.new_msg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg old "$OLD_MSG" \
            --arg new "$NEW_MSG" \
            --arg url "$RUN_URL" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{username:"AutoCommit",embeds:[{title:"Commit Message Fixed",url:$url,color:5763719,fields:[{name:"Repo",value:$repo,inline:true},{name:"Branch",value:$branch,inline:true},{name:"Before",value:$old,inline:false},{name:"After",value:$new,inline:false}],timestamp:(now|todate)}]}')
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
