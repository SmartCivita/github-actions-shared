name: Auto Commit Message

on:
  push:
    branches:
      - "*"
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  update-commit-message:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get commit info
        id: info
        run: |
          set -euo pipefail
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is not set}"

          # Skip merge commits: rewriting them is destructive and not worth the risk.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
            echo "is_merge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use diff-tree against HEAD itself: works even on a single-commit repo
          # where HEAD~1 does not exist.
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
          FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | grep -c . || true)
          DIFF_CONTENT=$(git show HEAD --unified=0 --no-color | grep -E '^\+[^+]' | head -20 || true)
          CURRENT_MSG=$(git log -1 --pretty=%s)

          {
            echo "is_merge=false"
            echo "current_msg<<EOF"
            echo "$CURRENT_MSG"
            echo "EOF"
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
            echo "file_count=$FILE_COUNT"
            echo "diff<<EOF"
            echo "$DIFF_CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fix commit message
        id: fix
        if: steps.info.outputs.is_merge != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CURRENT_MSG: ${{ steps.info.outputs.current_msg }}
          CHANGED_FILES: ${{ steps.info.outputs.files }}
          FILE_COUNT: ${{ steps.info.outputs.file_count }}
          DIFF_CONTENT: ${{ steps.info.outputs.diff }}
        run: |
          set -euo pipefail
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is not set}"

          # Already a conventional commit, nothing to do.
          if echo "$CURRENT_MSG" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)[:\(]'; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Create a SHORT conventional commit message. Output ONLY the message, nothing else.

          CURRENT MESSAGE: $CURRENT_MSG
          CHANGED FILES ($FILE_COUNT):
          $CHANGED_FILES

          CODE DIFF (added lines only):
          $DIFF_CONTENT

          RULES:
          - Format: type(scope) description
          - Max 72 characters
          - Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert
          - Description must reflect the actual code changes
          - NEVER use backticks, code fences, or markdown
          - Output ONLY the commit message on a single line"

          RESPONSE=$(timeout 60 opencode run --model opencode-go/qwen3.7-max "$PROMPT" 2>/dev/null || true)
          NEW_MSG=$(printf '%s' "$RESPONSE" | tr -d '`' | sed 's/^[*#>\ ]*//' | head -1 | cut -c1-72 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -z "$NEW_MSG" ]; then
            # Fallback: model unavailable or returned nothing. Build a minimal
            # conventional message from the changed files so the commit is still
            # rewritten into a valid form.
            FIRST_FILE=$(printf '%s' "$CHANGED_FILES" | head -1)
            case "$FIRST_FILE" in
              *.md)       NEW_MSG="docs: update $FIRST_FILE" ;;
              *.test.*|*.spec.*) NEW_MSG="test: update $FIRST_FILE" ;;
              *)          NEW_MSG="chore: update $FIRST_FILE" ;;
            esac
            NEW_MSG=$(printf '%s' "$NEW_MSG" | cut -c1-72)
          fi

          {
            echo "status=success"
            echo "new_msg<<EOF"
            echo "$NEW_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply fix
        if: steps.fix.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NEW_MSG: ${{ steps.fix.outputs.new_msg }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit --amend -m "$NEW_MSG" --no-verify
          git push --force-with-lease origin "$GITHUB_REF_NAME"

      - name: Discord notification
        if: steps.fix.outputs.status == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OLD_MSG: ${{ steps.info.outputs.current_msg }}
          NEW_MSG: ${{ steps.fix.outputs.new_msg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg old "$OLD_MSG" \
            --arg new "$NEW_MSG" \
            --arg url "$RUN_URL" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{username:"AutoCommit",embeds:[{title:"Commit Message Fixed",url:$url,color:5763719,fields:[{name:"Repo",value:$repo,inline:true},{name:"Branch",value:$branch,inline:true},{name:"Before",value:$old,inline:false},{name:"After",value:$new,inline:false}],timestamp:(now|todate)}]}')
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
