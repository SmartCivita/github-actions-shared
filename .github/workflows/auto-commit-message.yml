name: Auto Commit Message

on:
  push:
    branches:
      - "*"
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

# NOTE: do not declare `concurrency` here. This workflow is invoked via
# workflow_call from a top-level caller. Concurrency must be declared only on
# the top-level workflow, otherwise GitHub aborts with a deadlock error
# ("deadlock was detected for concurrency group ... between a top level
# workflow and ...").

jobs:
  update-commit-message:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: SmartCivita/github-actions-shared/.github/actions/auto-commit@main
        with:
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
          personal-access-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
