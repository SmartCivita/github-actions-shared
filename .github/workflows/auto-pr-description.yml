name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      runner-label:
        type: string
        default: self-hosted
        description: Runner label to use
    secrets:
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

# NOTE: do not declare `concurrency` here. This workflow is invoked via
# workflow_call from a top-level caller. Concurrency must be declared only on
# the top-level workflow, otherwise GitHub aborts with a deadlock error.

jobs:
  update-pr:
    runs-on: ${{ inputs.runner-label }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: SmartCivita/github-actions-shared/.github/actions/auto-pr@main
        with:
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
