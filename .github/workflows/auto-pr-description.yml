name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize]
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: main
        description: Target branch for PR
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true
      OPENCODE_API_KEY:
        required: true
      DISCORD_WEBHOOK:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update PR description
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        id: pr
        run: |
          echo "::add-mask::$OPENCODE_API_KEY"
          
          PR_NUMBER=${{ github.event.pull_request.number }}
          CURRENT_TITLE="${{ github.event.pull_request.title }}"
          TARGET_BRANCH="${{ inputs.target-branch }}"
          
          echo "Target branch: $TARGET_BRANCH"
          
          DIFF=$(git diff origin/$TARGET_BRANCH...HEAD 2>/dev/null | head -c 4000 || echo "")
          
          PROMPT="Respond in English. PR title+desc for diff. Title (72 chars max), blank line, description. Current: $CURRENT_TITLE"
          
          COMMIT_MSG=""
          
          for MODEL in mimo-v2.5-free nemotron-3-super-free; do
            RESPONSE=$(curl -sf --connect-timeout 10 --max-time 60 -X POST "https://opencode.ai/zen/v1/chat/completions" \
              -H "Authorization: Bearer $OPENCODE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg prompt "$PROMPT" --arg model "$MODEL" --arg diff "$DIFF" \
                '{model:$model, messages:[{role:"user",content:($prompt + "\n" + $diff)}], max_tokens:2048, temperature:0.3}')")
            
            [ $? -eq 0 ] && break
          done
          
          PR_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null)
          
          if [ -n "$PR_CONTENT" ] && [ "$PR_CONTENT" != "null" ]; then
            NEW_TITLE=$(echo "$PR_CONTENT" | head -1 | cut -c1-72)
            NEW_BODY=$(echo "$PR_CONTENT" | tail -n +3)
            
            curl -sf --connect-timeout 10 --max-time 30 -X PATCH \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              -d "$(jq -n --arg t "$NEW_TITLE" --arg b "$NEW_BODY" '{title:$t, body:$b}')"
            
            echo "status=success" >> $GITHUB_OUTPUT
            echo "title=$NEW_TITLE" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Add labels and assignee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: labels
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          
          FILES=$(curl -sf --connect-timeout 10 --max-time 15 -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/files" | jq -r '.[].filename')
          
          LABELS=$(echo "$FILES" | jq -r '
            [., inputs] | 
            if any(.[]; test("\\.github/workflows/")) then "ci" else empty end,
            if any(.[]; test("\\.(py|js|ts|go|java)$")) then "code" else empty end,
            if any(.[]; test("(README|docs/|\\.md)")) then "documentation" else empty end,
            if any(.[]; test("(test|spec)")) then "testing" else empty end,
            if any(.[]; test("(requirements|package\\.json|Dockerfile)")) then "dependencies" else empty end
          ' | paste -sd, -)
          
          [ -n "$LABELS" ] && curl -sf --connect-timeout 10 --max-time 15 -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels" \
            -d "$(jq -n --arg l "$LABELS" '{labels:($l | split(","))}')"
          
          [ "$PR_AUTHOR" != "JosephRiosHenao" ] && \
            curl -sf --connect-timeout 10 --max-time 15 -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers" \
              -d '{"reviewers":["JosephRiosHenao"]}'
          
          curl -sf --connect-timeout 10 --max-time 15 -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/assignees" \
            -d "$(jq -n --arg u "$PR_AUTHOR" '{assignees:[$u]}')"
          
          echo "labels=$LABELS" >> $GITHUB_OUTPUT
          echo "assignee=$PR_AUTHOR" >> $GITHUB_OUTPUT

      - name: Discord notification
        if: ${{ steps.pr.outputs.status == 'success' }}
        uses: SmartCivita/github-actions-shared/.github/actions/discord-notify@main
        with:
          title: "PR Updated"
          color: "5763719"
          description: ""
          url: "${{ github.event.pull_request.html_url }}"
          event-type: pr
          old-msg: "${{ github.event.pull_request.title }}"
          new-msg: "${{ steps.pr.outputs.title }}"
          commit-sha: "${{ github.sha }}"
          pr-number: "${{ github.event.pull_request.number }}"
          status: success
          run-url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          webhook: ${{ secrets.DISCORD_WEBHOOK }}