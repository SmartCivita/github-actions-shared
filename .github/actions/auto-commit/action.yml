name: Auto Commit
description: Rewrite a non-conventional commit message into a conventional one using opencode, and notify Discord.

inputs:
  opencode-api-key:
    description: API key for the opencode model provider
    required: true
  discord-webhook:
    description: Discord webhook URL for notifications
    required: true
  personal-access-token:
    description: GitHub PAT with repo write access used to push the amended commit
    required: true
  notify:
    description: Send a Discord notification after a successful fix
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Detect if HEAD is a merge commit
      id: merge-check
      shell: bash
      run: bash "${{ github.action_path }}/scripts/detect-merge.sh"

    - name: Extract commit data (message, files, diff)
      id: data
      if: steps.merge-check.outputs.is_merge != 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/extract-commit-data.sh"

    - name: Check if commit message is already conventional
      id: check
      if: steps.merge-check.outputs.is_merge != 'true'
      shell: bash
      env:
        CURRENT_MSG: ${{ steps.data.outputs.current_msg }}
      run: bash "${{ github.action_path }}/scripts/check-conventional.sh"

    - name: Generate conventional message with opencode
      id: generate
      if: steps.check.outputs.status == 'needs-fix'
      shell: bash
      env:
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        CURRENT_MSG: ${{ steps.data.outputs.current_msg }}
        CHANGED_FILES: ${{ steps.data.outputs.files }}
        FILE_COUNT: ${{ steps.data.outputs.file_count }}
        DIFF_CONTENT: ${{ steps.data.outputs.diff }}
      run: bash "${{ github.action_path }}/scripts/generate-message.sh" "${{ github.action_path }}/prompt.txt"

    - name: Sanitize model output
      id: sanitize
      if: steps.generate.outputs.raw_response != ''
      shell: bash
      env:
        raw_response: ${{ steps.generate.outputs.raw_response }}
      run: bash "${{ github.action_path }}/scripts/sanitize-message.sh"

    - name: Amend commit and force-push
      id: apply
      if: steps.sanitize.outputs.status == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.personal-access-token }}
        NEW_MSG: ${{ steps.sanitize.outputs.new_msg }}
      run: bash "${{ github.action_path }}/scripts/apply-commit-fix.sh"

    - name: Send Discord notification
      if: steps.apply.result == 'success' && inputs.notify == 'true'
      uses: SmartCivita/github-actions-shared/.github/actions/discord-notify@main
      with:
        title: Commit Message Fixed
        event-type: commit
        old-msg: ${{ steps.data.outputs.current_msg }}
        new-msg: ${{ steps.sanitize.outputs.new_msg }}
        webhook: ${{ inputs.discord-webhook }}
        run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
