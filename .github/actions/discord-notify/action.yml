name: Discord Notify
description: Send notifications to Discord via webhook

inputs:
  title:
    description: Notification title
    required: true
  color:
    description: Embed color (decimal)
    default: "5763719"
  description:
    description: Embed description
    default: ""
  url:
    description: Link URL
    default: ""
  event-type:
    description: Event type (commit, pr, ci, issue, release, deploy)
    default: "default"
  old-msg:
    description: Previous message
    default: ""
  new-msg:
    description: New message
    default: ""
  commit-sha:
    description: Commit SHA
    default: ""
  pr-number:
    description: PR number
    default: ""
  webhook:
    description: Discord webhook URL
    required: true
  status:
    description: Status (success, skipped, failure)
    default: "success"
  run-url:
    description: Workflow run URL
    default: ""

runs:
  using: composite
  steps:
    - name: Run discord-notify script
      shell: bash
      env:
        DISCORD_WEBHOOK: ${{ inputs.webhook }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_ACTOR: ${{ github.actor }}
        STATUS: ${{ inputs.status }}
        RUN_URL: ${{ inputs.run-url }}
      run: |
        chmod +x ${{ github.action_path }}/discord-notify.sh
        ${{ github.action_path }}/discord-notify.sh "${{ inputs.title }}" "${{ inputs.color }}" "${{ inputs.description }}" "${{ inputs.url }}" "${{ inputs.event-type }}" "${{ inputs.old-msg }}" "${{ inputs.new-msg }}" "${{ inputs.commit-sha }}" "${{ inputs.pr-number }}"